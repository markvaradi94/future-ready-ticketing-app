# The cloud profile: MongoDB Atlas and CloudAMQP, from the same environment variables as ticketing.
#   ./gradlew :notification-service:bootRun --args='--spring.profiles.active=cloud'
spring:
  mongodb:
    protocol: mongodb+srv
    host: ${MONGODB_HOST}
    username: ${MONGODB_USERNAME}
    password: ${MONGODB_PASSWORD}
    database: notifications
  rabbitmq:
    # CloudAMQP in pieces, from the console's AMQP details, like Atlas: TLS on port 5671. On the shared plans the
    # virtual host is the username; CLOUDAMQP_VHOST overrides it.
    host: ${CLOUDAMQP_HOST}
    port: 5671
    username: ${CLOUDAMQP_USERNAME}
    password: ${CLOUDAMQP_PASSWORD}
    virtual-host: ${CLOUDAMQP_VHOST:${CLOUDAMQP_USERNAME}}
    ssl:
      enabled: true
  docker:
    compose:
      # Atlas and CloudAMQP replace the local containers.
      enabled: false
