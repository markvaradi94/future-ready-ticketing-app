services:
  ticketing-service:
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_MONGODB_PROTOCOL: mongodb+srv
      SPRING_MONGODB_HOST: ${MONGODB_HOST}
      SPRING_MONGODB_USERNAME: ${MONGODB_USERNAME}
      SPRING_MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${CLOUDAMQP_HOST}
      SPRING_RABBITMQ_USERNAME: ${CLOUDAMQP_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${CLOUDAMQP_PASSWORD}
      SPRING_RABBITMQ_VIRTUALHOST: ${CLOUDAMQP_VHOST:-${CLOUDAMQP_USERNAME}}
      SPRING_RABBITMQ_PORT: 5671
      SPRING_RABBITMQ_SSL_ENABLED: true
      
  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_MONGODB_PROTOCOL: mongodb+srv
      SPRING_MONGODB_HOST: ${MONGODB_HOST}
      SPRING_MONGODB_USERNAME: ${MONGODB_USERNAME}
      SPRING_MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      SPRING_RABBITMQ_HOST: ${CLOUDAMQP_HOST}
      SPRING_RABBITMQ_USERNAME: ${CLOUDAMQP_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${CLOUDAMQP_PASSWORD}
      SPRING_RABBITMQ_VIRTUALHOST: ${CLOUDAMQP_VHOST:-${CLOUDAMQP_USERNAME}}
      SPRING_RABBITMQ_PORT: 5671
      SPRING_RABBITMQ_SSL_ENABLED: true