spring:
  application:
    name: notification
  mongodb:
    database: notifications
  docker:
    compose:
      lifecycle-management: start-only
  data:
    mongodb:
      auto-index-creation: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8086
