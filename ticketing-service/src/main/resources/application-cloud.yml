# The cloud profile: the database in MongoDB Atlas, a dev environment of its own. Nothing is seeded there.
#   ./gradlew bootRun --args='--spring.profiles.active=cloud'
# The MONGODB_* variables come from the environment. The password is never written in a file; the host and
# the user differ for each of you, so they come from outside too.
spring:
  mongodb:
    protocol: mongodb+srv
    host: ${MONGODB_HOST}
    username: ${MONGODB_USERNAME}
    password: ${MONGODB_PASSWORD}
    database: ${MONGODB_DATABASE:ticketing}

  rabbitmq:
    # CloudAMQP in pieces, from the console's AMQP details, like Atlas: TLS on port 5671. On the shared plans the
    # virtual host is the username; CLOUDAMQP_VHOST overrides it.
    host: ${CLOUDAMQP_HOST}
    port: 5671
    username: ${CLOUDAMQP_USERNAME}
    password: ${CLOUDAMQP_PASSWORD}
    virtual-host: ${CLOUDAMQP_VHOST:${CLOUDAMQP_USERNAME}}
    ssl:
      enabled: true
  docker:
    compose:
      enabled: false
