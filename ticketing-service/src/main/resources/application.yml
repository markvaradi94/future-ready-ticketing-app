spring:
  application:
    name: ticketing
  mongodb:
    database: ticketing
  docker:
    compose:
      # compose.yml is in the repository's root, one level above this service.
      file: ../compose.yml
      # Both services use the same containers: start them if they are not running, and leave them running on exit.
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8085