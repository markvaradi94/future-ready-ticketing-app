# The JPA demo's database: Postgres on port 5433, and pgAdmin, a web UI for it, on http://localhost:5050.
# pgAdmin runs in desktop mode (no login); pgadmin/servers.json registers the server. The first connection asks for
# the password: ticketing.
services:
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@frit.ro
      PGADMIN_DEFAULT_PASSWORD: demo
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
